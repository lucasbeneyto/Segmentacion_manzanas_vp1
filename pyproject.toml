[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-seg"
version = "0.1.0"
description = "Segmentacion de manzanas en arbol con vision por computador clasica"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.scripts]
apple-seg = "apple_seg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
